<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Focused Minds Creative — Bespoke Software &amp; Mobile Apps</title>
  <meta name="description" content="Focused Minds Creative builds clear, secure software and mobile apps that save time. Based in the UK.">
  <script>
    document.addEventListener("error", function (e) {
      var t = e.target;
      if (t && t.tagName === "IMG") {
        var s = t.getAttribute("src") || "";
        if (s.slice(-5) === ".avif") { t.src = s.slice(0, -5) + ".webp"; }
        else if (s.slice(-5) === ".webp") { t.src = s.slice(0, -5) + ".png"; }
      }
    }, true);
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
